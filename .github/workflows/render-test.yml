name: Render test only

on:
  push:
    branches:
      - main
    paths:
      - ".render-test/*.txt"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve episode slug
        id: episode
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            mapfile -t trigger_files < <(
              git show --pretty='' --name-only --diff-filter=A "$AFTER_SHA" -- '.render-test/*.txt'
            )
          else
            mapfile -t trigger_files < <(
              git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- '.render-test/*.txt'
            )
          fi

          if [[ ${#trigger_files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one new render-test trigger, found ${#trigger_files[@]}."
            exit 1
          fi

          trigger_file="${trigger_files[0]}"
          episode="$(tr -d '\r\n' < "$trigger_file" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [[ -z "$episode" ]]; then
            episode="$(basename "$trigger_file" .txt)"
          fi

          if [[ ! "$episode" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]]; then
            echo "::error::Invalid episode slug."
            exit 1
          fi

          if [[ ! -d "episodes/$episode" ]]; then
            echo "::error::Episode directory episodes/$episode does not exist."
            exit 1
          fi

          echo "slug=$episode" >> "$GITHUB_OUTPUT"
          echo "Render-only episode: $episode"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js for yt-dlp EJS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Render episode only
        env:
          EPISODE: ${{ steps.episode.outputs.slug }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py "$EPISODE"

      - name: Deliver rendered MP4 via temporary link
        id: delivery
        env:
          EPISODE: ${{ steps.episode.outputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          path="output/${EPISODE}.mp4"
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors -F "file=@${path}" https://tmpfiles.org/api/v1/upload)"
          url="$(python -c 'import json,sys; print(json.load(sys.stdin)["data"]["url"])' <<< "$response")"
          direct_url="${url/https:\/\/tmpfiles.org\//https:\/\/tmpfiles.org\/dl\/}"
          if [[ ! "$direct_url" =~ ^https://tmpfiles\.org/dl/ ]]; then
            echo "::error::Temporary upload did not return a valid download URL."
            exit 1
          fi
          echo "RENDER_DOWNLOAD_URL=$direct_url"
          echo "url=$direct_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Render test"
            echo
            echo "Download: $direct_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm no publishing
        run: echo "Render test complete. No social publish command was executed and no GitHub Actions artifact was stored."
