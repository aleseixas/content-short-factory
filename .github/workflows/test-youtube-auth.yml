name: Test YouTube visual download

on:
  workflow_dispatch:
    inputs:
      test_episode:
        description: Existing episode slug used only for the optional resolver/handoff smoke test
        type: string
        default: luisa_sonza_menescal_rock_in_rio_2026
      probe_only:
        description: Run only the safe YouTube auth/download probes (no episode resolution or handoff)
        type: boolean
        default: false
      youtube_url:
        description: Public YouTube URL to probe
        type: string
        default: https://www.youtube.com/watch?v=DKZV_DbmWQo
  push:
    branches:
      - main
    paths:
      - ".youtube-auth-test/*.txt"

permissions:
  contents: read

env:
  TEST_EPISODE: ${{ inputs.test_episode || 'luisa_sonza_menescal_rock_in_rio_2026' }}
  TEST_YOUTUBE_URL: ${{ inputs.youtube_url || 'https://www.youtube.com/watch?v=DKZV_DbmWQo' }}

jobs:
  youtube-visual-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js for yt-dlp EJS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            exit 0
          fi

          while IFS= read -r source; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "${source}.disabled"
            fi
          done < <(find /etc/apt/sources.list.d -maxdepth 1 -type f -print)

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify download stack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yt_dlp
          print(f"yt-dlp: {yt_dlp.version.__version__}")
          PY
          node --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Test YouTube metadata auth path
        env:
          PYTHONPATH: .
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_AUTH_TEST_URL: ${{ env.TEST_YOUTUBE_URL }}
        run: python scripts/test_youtube_auth.py

      - name: Download and validate real YouTube clip
        env:
          PYTHONPATH: .
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_DOWNLOAD_TEST_URL: ${{ env.TEST_YOUTUBE_URL }}
          YOUTUBE_DOWNLOAD_TEST_SECONDS: "8"
        run: python scripts/test_youtube_download.py

      - name: Resolve test episode visual candidates without publishing
        if: ${{ !inputs.probe_only }}
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python resolve_visual_candidates_web_auth.py "$TEST_EPISODE"

      - name: Verify resolver output
        if: ${{ !inputs.probe_only }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "episodes/$TEST_EPISODE/visual_resolution_report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          episode = os.environ["TEST_EPISODE"]
          report_path = Path("episodes") / episode / "visual_resolution_report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          selections = report.get("selections") or {}
          selected = [slot for slot, value in selections.items() if isinstance(value, dict) and value.get("status") == "selected"]
          print(f"Resolver report: {len(selections)} slots, {len(selected)} selected")
          if not selections:
              raise SystemExit("Resolver produced no slot selections")
          PY

      - name: Stage visual handoff
        if: ${{ !inputs.probe_only }}
        env:
          EPISODE: ${{ env.TEST_EPISODE }}
        run: python scripts/stage_visual_handoff.py

      - name: Verify staged handoff locally
        if: ${{ !inputs.probe_only }}
        shell: bash
        run: |
          set -euo pipefail
          test -f ".visual-handoff/episodes/$TEST_EPISODE/assets.json"
          test -f ".visual-handoff/episodes/$TEST_EPISODE/timeline.json"
          test -f ".visual-handoff/episodes/$TEST_EPISODE/visual_resolution_report.json"
          find .visual-handoff -type f -maxdepth 5 -print

      - name: Upload visual handoff smoke artifact
        if: ${{ !inputs.probe_only }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-handoff-smoke-${{ github.run_id }}
          path: .visual-handoff
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  handoff-smoke-test:
    if: ${{ !inputs.probe_only }}
    needs: youtube-visual-smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Download visual handoff smoke artifact
        uses: actions/download-artifact@v7
        with:
          name: visual-handoff-smoke-${{ github.run_id }}
          path: .visual-handoff

      - name: Verify handoff survived artifact transfer
        shell: bash
        run: |
          set -euo pipefail
          test -f ".visual-handoff/episodes/$TEST_EPISODE/assets.json"
          test -f ".visual-handoff/episodes/$TEST_EPISODE/timeline.json"
          test -f ".visual-handoff/episodes/$TEST_EPISODE/visual_resolution_report.json"
          echo "VISUAL_HANDOFF_TRANSFER_OK"
          find .visual-handoff -type f -maxdepth 5 -print


  credential-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check required secrets
        id: presence
        shell: python
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          import os
          names = [
              "CLOUDINARY_API_KEY","CLOUDINARY_API_SECRET","CLOUDINARY_CLOUD_NAME",
              "FACEBOOK_PAGE_ACCESS_TOKEN","FACEBOOK_PAGE_ID","GEMINI_API_KEY",
              "INSTAGRAM_ACCESS_TOKEN","INSTAGRAM_ACCOUNT_ID",
              "TIKTOK_CLIENT_KEY","TIKTOK_CLIENT_SECRET","TIKTOK_REFRESH_TOKEN",
              "YOUTUBE_CLIENT_ID","YOUTUBE_CLIENT_SECRET","YOUTUBE_REFRESH_TOKEN",
          ]
          missing=[n for n in names if not os.environ.get(n,"").strip()]
          if missing:
              raise SystemExit("Missing secrets: "+", ".join(missing))
          print("SECRETS_PRESENT_OK")

      - name: Test Gemini
        id: gemini
        continue-on-error: true
        shell: python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          import json, os, urllib.parse, urllib.request
          q=urllib.parse.urlencode({"key":os.environ["GEMINI_API_KEY"],"pageSize":1})
          with urllib.request.urlopen("https://generativelanguage.googleapis.com/v1beta/models?"+q,timeout=30) as r:
              data=json.load(r)
          assert "models" in data
          print("GEMINI_OK")

      - name: Test Cloudinary
        id: cloudinary
        continue-on-error: true
        shell: python
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        run: |
          import base64, json, os, urllib.parse, urllib.request
          auth=base64.b64encode((os.environ["CLOUDINARY_API_KEY"]+":"+os.environ["CLOUDINARY_API_SECRET"]).encode()).decode()
          req=urllib.request.Request(
              "https://api.cloudinary.com/v1_1/"+urllib.parse.quote(os.environ["CLOUDINARY_CLOUD_NAME"],safe="")+"/resources/image?max_results=1",
              headers={"Authorization":"Basic "+auth},
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          assert "resources" in data
          print("CLOUDINARY_OK")

      - name: Test Facebook
        id: facebook
        continue-on-error: true
        shell: python
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          import json, os, urllib.parse, urllib.request
          page=os.environ["FACEBOOK_PAGE_ID"]
          req=urllib.request.Request(
              "https://graph.facebook.com/v26.0/"+urllib.parse.quote(page,safe="")+"?fields=id,name",
              headers={"Authorization":"Bearer "+os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"]},
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          assert str(data.get("id"))==page
          print("FACEBOOK_OK name="+str(data.get("name","<unknown>")))

      - name: Test Instagram
        id: instagram
        continue-on-error: true
        shell: python
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          import json, os, urllib.parse, urllib.request
          account=os.environ["INSTAGRAM_ACCOUNT_ID"]
          req=urllib.request.Request(
              "https://graph.facebook.com/v26.0/"+urllib.parse.quote(account,safe="")+"?fields=id,username",
              headers={"Authorization":"Bearer "+os.environ["INSTAGRAM_ACCESS_TOKEN"]},
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          assert str(data.get("id"))==account
          print("INSTAGRAM_OK username="+str(data.get("username","<unknown>")))

      - name: Test YouTube OAuth
        id: youtube_oauth
        continue-on-error: true
        shell: python
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          import json, os, urllib.parse, urllib.request
          body=urllib.parse.urlencode({
              "client_id":os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret":os.environ["YOUTUBE_CLIENT_SECRET"],
              "refresh_token":os.environ["YOUTUBE_REFRESH_TOKEN"],
              "grant_type":"refresh_token",
          }).encode()
          req=urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=body,
              headers={"Content-Type":"application/x-www-form-urlencoded"},
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              token=json.load(r)
          access=token.get("access_token")
          if not access:
              raise SystemExit("YouTube OAuth did not return access_token")
          q=urllib.parse.urlencode({"access_token":access})
          with urllib.request.urlopen("https://oauth2.googleapis.com/tokeninfo?"+q,timeout=30) as r:
              info=json.load(r)
          scopes=set(str(info.get("scope","")).split())
          required="https://www.googleapis.com/auth/youtube.upload"
          if required not in scopes:
              raise SystemExit("YouTube token is valid but youtube.upload scope is missing")
          print("YOUTUBE_OAUTH_OK scope=youtube.upload")

      - name: Test TikTok client credentials safely
        id: tiktok
        continue-on-error: true
        shell: python
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          import json, os, urllib.error, urllib.parse, urllib.request
          if not os.environ["TIKTOK_REFRESH_TOKEN"].strip():
              raise SystemExit("TikTok refresh token missing")
          body=urllib.parse.urlencode({
              "client_key":os.environ["TIKTOK_CLIENT_KEY"],
              "client_secret":os.environ["TIKTOK_CLIENT_SECRET"],
              "refresh_token":"credential-smoke-test-not-a-real-token",
              "grant_type":"refresh_token",
          }).encode()
          req=urllib.request.Request(
              "https://open.tiktokapis.com/v2/oauth/token/",
              data=body,
              headers={"Content-Type":"application/x-www-form-urlencoded"},
          )
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  payload=json.load(r)
          except urllib.error.HTTPError as exc:
              payload=json.loads(exc.read().decode("utf-8","replace") or "{}")
          error=str(payload.get("error","")).lower()
          if error=="invalid_client":
              raise SystemExit("TikTok client key/secret invalid")
          print("TIKTOK_CLIENT_OK response="+(error or "accepted"))
          print("TIKTOK_REFRESH_PRESENT_OK (real refresh intentionally not used)")

      - name: Credential smoke summary
        if: always()
        shell: bash
        env:
          PRESENCE: ${{ steps.presence.outcome }}
          GEMINI: ${{ steps.gemini.outcome }}
          CLOUDINARY: ${{ steps.cloudinary.outcome }}
          FACEBOOK: ${{ steps.facebook.outcome }}
          INSTAGRAM: ${{ steps.instagram.outcome }}
          YOUTUBE: ${{ steps.youtube_oauth.outcome }}
          TIKTOK: ${{ steps.tiktok.outcome }}
        run: |
          set -euo pipefail
          printf 'presence=%s\ngemini=%s\ncloudinary=%s\nfacebook=%s\ninstagram=%s\nyoutube=%s\ntiktok=%s\n' \
            "$PRESENCE" "$GEMINI" "$CLOUDINARY" "$FACEBOOK" "$INSTAGRAM" "$YOUTUBE" "$TIKTOK"
          [[ "$PRESENCE" == "success" && "$GEMINI" == "success" && "$CLOUDINARY" == "success" && "$FACEBOOK" == "success" && "$INSTAGRAM" == "success" && "$YOUTUBE" == "success" && "$TIKTOK" == "success" ]]
